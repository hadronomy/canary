name: canary

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - '3001:3001'
    env_file:
      - path: apps/web/.env.local
        required: false
    environment:
      APP_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3001
      AGENT_MODEL: ${AGENT_MODEL:-~moonshotai/kimi-latest}
      CANARY_MCP_URL: ${CANARY_MCP_URL:-http://host.docker.internal:3000}
      CORS_ORIGIN: http://localhost:3001
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_PORT: '5432'
      DB_USERNAME: postgres
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:?Set ELECTRIC_SECRET}
      ELECTRIC_URL: http://electric:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VITE_SERVER_URL: http://localhost:3001
    depends_on:
      electric:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_slot_wal_keep_size=10GB']
    image: postgres:18
    container_name: canary-postgres
    environment:
      POSTGRES_DB: canary
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d canary']
      interval: 10s
      retries: 5
      timeout: 5s
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - canary_postgres_data:/var/lib/postgresql

  electric:
    image: electricsql/electric:1.8.1
    container_name: canary-electric
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/canary
      ELECTRIC_INSECURE: ${ELECTRIC_INSECURE:-false}
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:?Set ELECTRIC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3002:3000'
    restart: unless-stopped

volumes:
  canary_postgres_data:
