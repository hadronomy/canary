[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors     = ["Pablo Hernandez <hadronomy@gmail.com> (https://hadronomy.com/)"]
description = "Language tools for the `ram` language"
edition     = "2024"
license     = "MIT"
publish     = false
repository  = "https://github.com/hadronomy/ram"
version     = "0.1.0-alpha.1"

[workspace.dependencies]
async-trait           = "0.1.89"
aws-config            = "1.8.10"
aws-credential-types  = "1.2.10"
aws-sdk-s3            = { version = "1.115.0", features = ["http-1x"] }
aws-types             = "1.3.10"
axum                  = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
bs58                  = "0.5.1"
bytes                 = "1.10.1"
chrono                = "0.4.42"
config                = "0.15.18"
criterion             = { version = "0.8.2", features = ["html_reports"] }
database              = { path = "crates/database", default-features = false }
deunicode             = "1.6"
gungraun              = "0.19.0"
headers               = "0.4.1"
http                  = "1.4.0"
human-panic           = "2.0.4"
humantime-serde       = "1.1.1"
indextree             = { version = "4.7", features = ["par_iter", "deser"] }
infer                 = "0.19.0"
miette                = "7.6.0"
mime                  = "0.3.17"
mime_guess            = "2.0.5"
object_store          = { version = "0.12.5", default-features = false }
proc-macro2           = "1.0.106"
quick-xml             = "0.39.2"
quote                 = "1.0.45"
rayon                 = "1.10"
secrecy               = { version = "0.10.3", features = ["serde"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1.0.145"
sha2                  = "0.10.9"
smallvec              = { version = "1", features = ["serde"] }
smol_str              = { version = "0.3", features = ["serde"] }
surrealdb             = { version = "2.3.10", default-features = false }
syn                   = { version = "2.0.117", features = ["full", "parsing", "extra-traits"] }
tempfile              = "3.23.0"
thiserror             = "2"
tokio                 = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util            = { version = "0.7.18", features = ["io"] }
toml                  = "0.9.8"
tower                 = "0.5.2"
tower-http            = "0.6.10"
tracing               = "0.1.41"
tracing-subscriber    = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
trybuild              = "1.0.116"
unicode-normalization = "0.1.24"
url                   = { version = "2.5.7", features = ["serde"] }
uuid                  = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zeroize               = "1.8.2"


[profile.release]
debug       = 1
incremental = true
lto         = true
opt-level   = 3
strip       = "none"

[profile.bench]
debug = true
strip = false

[profile.dev.package]
insta.opt-level = 3
