[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors     = ["Pablo Hernandez <hadronomy@gmail.com> (https://hadronomy.com/)"]
description = "Language tools for the `ram` language"
edition     = "2024"
license     = "MIT"
publish     = false
repository  = "https://github.com/hadronomy/ram"
version     = "0.1.0-alpha.1"

[workspace.dependencies]
chrono = "0.4.42"
deunicode = "1.6"
indextree = { version = "4.7", features = ["par_iter", "deser"] }
quick-xml = "0.39.2"
rayon     = "1.10"
serde     = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-normalization = "0.1.24"


[profile.release]
debug       = 1
incremental = true
lto         = true
opt-level   = 3
strip       = "none"

[profile.bench]
debug = true
strip = false

[profile.dev.package.backtrace]
opt-level = 3
