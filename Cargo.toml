[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors     = ["Pablo Hernandez <hadronomy@gmail.com> (https://hadronomy.com/)"]
description = "AI legal assistant and retrieval infrastructure for Spanish law"
edition     = "2024"
license     = "MIT"
publish     = false
repository  = "https://github.com/hadronomy/canary"
version     = "0.1.0-alpha.1"

[workspace.dependencies]
anyhow = "1.0.100"
arc-swap = "1.9.1"
async-nats = { version = "0.49.1", default-features = false, features = [
  "jetstream",
  "object-store",
  "ring",
  "server_2_14",
] }
async-trait = "0.1.89"
aws-config = "1.8.10"
aws-credential-types = "1.2.10"
aws-sdk-s3 = { version = "1.115.0", features = ["http-1x"] }
aws-types = "1.3.10"
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
base64 = "0.22.1"
bs58 = "0.5.1"
bytes = "1.10.1"
chrono = "0.4.42"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.1"
clap_mangen = "0.2"
config = "0.15.18"
criterion = { version = "0.8.2", features = ["html_reports"] }
deunicode = "1.6"
flatbuffers = "25.12.19"
flatc-rust = "0.2.0"
futures = "0.3.31"
futures-util = "0.3.31"
gungraun = "0.19.0"
headers = "0.4.1"
http = "1.4.0"
human-panic = "2.0.4"
humantime = "2.3.0"
humantime-serde = "1.1.1"
indextree = { version = "4.7", features = ["par_iter", "deser"] }
infer = "0.19.0"
jsonwebtoken = { version = "10.4.0", default-features = false }
miette = "7.6.0"
mime = "0.3.17"
mime_guess = "2.0.5"
moka = "0.12.15"
oauth2 = { version = "5.0.0", default-features = false }
object_store = { version = "0.12.5", default-features = false }
openidconnect = { version = "4.0.1", default-features = false }
pin-project-lite = "0.2.16"
proc-macro2 = "1.0.106"
prost = "0.14.1"
quick-xml = "0.39.2"
quote = "1.0.45"
rayon = "1.10"
reqwest = { version = "0.12.24", default-features = false }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
surrealdb = { version = "2.3.10", default-features = false }
syn = { version = "2.0.117", features = ["full", "parsing", "extra-traits"] }
tempfile = "3.23.0"
temporalio-client = "0.4.0"
temporalio-common = "0.4.0"
temporalio-macros = "0.4.0"
temporalio-sdk = "0.4.0"
temporalio-sdk-core = "0.4.0"
thiserror = "2"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "0.9.8"
tower = "0.5.2"
tower-http = "0.6.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
trybuild = "1.0.116"
unicode-normalization = "0.1.24"
unicode-width = "0.2.2"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zeroize = "1.8.2"

canary-authorization = { path = "crates/authorization" }
canary-report        = { path = "crates/report" }
canary-workers       = { path = "crates/workers" }
database             = { path = "crates/database", default-features = false }
document-hierarchy   = { path = "crates/parser" }
parser-macros        = { path = "crates/parser-macros" }
public-id            = { path = "crates/public-id" }


[profile.release]
debug       = 1
incremental = true
lto         = true
opt-level   = 3
strip       = "none"

[profile.bench]
debug = true
strip = false

[profile.dev.package]
insta.opt-level = 3
