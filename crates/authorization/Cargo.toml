[package]
name              = "canary-authorization"
publish.workspace = true

authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
version.workspace    = true

[dependencies]
arc-swap.workspace        = true
axum                      = { workspace = true, optional = true }
base64.workspace          = true
chrono                    = { workspace = true, optional = true }
headers.workspace         = true
http.workspace            = true
humantime-serde.workspace = true
jsonwebtoken.workspace    = true
moka                      = { workspace = true, features = ["future"], optional = true }
oauth2                    = { workspace = true, features = ["reqwest", "rustls-tls"], optional = true }
openidconnect             = { workspace = true, optional = true }
public-id.workspace       = true
reqwest                   = { workspace = true, features = ["json", "rustls-tls"] }
secrecy.workspace         = true
serde.workspace           = true
serde_json.workspace      = true
sha2                      = { workspace = true, optional = true }
smol_str.workspace        = true
thiserror.workspace       = true
tokio.workspace           = true
url.workspace             = true

[features]
axum            = ["dep:axum"]
better-auth     = ["introspection", "oidc-discovery"]
default         = ["jwt-rust-crypto"]
ec              = []
introspection   = ["dep:chrono", "dep:moka", "dep:oauth2", "dep:sha2"]
jwt-aws-lc-rs   = ["jsonwebtoken/aws_lc_rs"]
jwt-rust-crypto = ["jsonwebtoken/rust_crypto"]
oidc-discovery  = ["dep:openidconnect"]

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
