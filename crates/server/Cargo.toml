[package]
name              = "canary-server"
autobins          = false
default-run       = "canary"
publish.workspace = true

authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
version.workspace    = true

[[bin]]
name = "canary"
path = "src/main.rs"

[dependencies]
async-trait.workspace          = true
aws-config.workspace           = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace           = true
aws-types.workspace            = true
axum.workspace                 = true
base64.workspace               = true
bytes.workspace                = true
chrono.workspace               = true
clap.workspace                 = true
clap_complete.workspace        = true
clap_mangen.workspace          = true
config.workspace               = true
headers.workspace              = true
http.workspace                 = true
human-panic.workspace          = true
humantime.workspace            = true
humantime-serde.workspace      = true
infer.workspace                = true
miette                         = { workspace = true, features = ["fancy-no-backtrace"] }
mime.workspace                 = true
mime_guess.workspace           = true
object_store                   = { workspace = true, features = ["aws"] }
secrecy.workspace              = true
serde.workspace                = true
serde_json.workspace           = true
sha2.workspace                 = true
smol_str.workspace             = true
thiserror.workspace            = true
tokio-util.workspace           = true
tokio.workspace                = true
toml.workspace                 = true
tower                          = { workspace = true, features = ["timeout", "util"] }
tower-http                     = { workspace = true, features = [
  "catch-panic",
  "compression-full",
  "fs",
  "limit",
  "normalize-path",
  "request-id",
  "sensitive-headers",
  "timeout",
  "trace",
] }
tracing-subscriber.workspace   = true
tracing.workspace              = true
unicode-width.workspace        = true
url.workspace                  = true
uuid.workspace                 = true
zeroize.workspace              = true

anstream = "1.0.0"
anstyle = "1.0.14"
futures-util = "0.3.31"
rmcp = { version = "1.7.0", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
schemars = "1.2.1"
shadow-rs = { version = "2.0.0", default-features = false }

canary-authorization         = { workspace = true, features = ["axum", "better-auth"] }
canary-report.workspace      = true
database.workspace           = true
document-hierarchy.workspace = true
public-id.workspace          = true

[features]
default = ["surreal-embedded-mem", "surreal-remote-ws"]
surreal-all = [
  "surreal-embedded-mem",
  "surreal-embedded-rocksdb",
  "surreal-embedded-surrealkv",
  "surreal-remote-http",
  "surreal-remote-ws",
]
surreal-embedded-mem = ["database/embedded-mem"]
surreal-embedded-rocksdb = ["database/embedded-rocksdb"]
surreal-embedded-surrealkv = ["database/embedded-surrealkv"]
surreal-remote-http = ["database/remote-http"]
surreal-remote-ws = ["database/remote-ws"]

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
reqwest      = { workspace = true, features = ["json", "rustls-tls"] }
trycmd       = "1.2"

crc64fast-nvme = "1.2.1"

[build-dependencies]
rusty-figlet = { version = "0.3.5", default-features = false }
shadow-rs    = { version = "2.0.0", default-features = false, features = ["build"] }
