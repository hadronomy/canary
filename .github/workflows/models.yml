name: Model catalog

# The catalog is generated from models.dev, which changes as OpenRouter adds
# and retires models. It is checked on a schedule rather than on pull requests:
# a check that follows live data would fail changes that have nothing to do
# with it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the catalog against models.dev
        run: bun run models:check
