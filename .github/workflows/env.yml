name: Environment contract

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: env-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: build
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate schemas
        shell: bash
        run: |
          auth="$(openssl rand -hex 32)"
          db="$(openssl rand -hex 32)"

          for dir in . apps/web packages/auth packages/db packages/agents packages/api; do
            echo "::group::$dir/.env.schema"
            (cd "$dir" && BETTER_AUTH_SECRET="$auth" DB_PASSWORD="$db" bunx --no-install varlock load --agent)
            echo "::endgroup::"
          done

      - name: Verify web image
        run: bun run env:verify-image
